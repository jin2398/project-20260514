<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게임 아이템 상점</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎮 게임 상점</h1>
    <button id="cart-btn">🛒 장바구니 (<span id="cart-count">0</span>)</button>
</header>

<main>
    <div class="filters">
        <button onclick="filterItems('all')">전체</button>
        <button onclick="filterItems('weapon')">무기</button>
        <button onclick="filterItems('potion')">포션</button>
    </div>

    <div id="item-list"></div>
</main>

<div id="cart">
    <h2>장바구니</h2>
    <ul id="cart-items"></ul>
    <p id="total"></p>
</div>

<script src="script.js"></script>
</body>
</html>
